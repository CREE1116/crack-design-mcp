# 크랙(Crack) 런타임 동작 사양
#
# 출처 및 신뢰도:
#   [OBSERVED]   dcinside 뤼튼 마이너갤 #961451 — 유저가 프롬프트 추출로 역공학.
#                글쓴이 본인 주석: "제미나이 2.5는 환각을 잘 지어냄. 3.1로 교차검증 2회 반복.
#                절대라는 건 없으니 순서만큼은 너무 맹신하지 마셈."
#                → 1차 실측 아님. 반증 나오면 즉시 교체할 것.
#   [USER-OBSERVED] 이 도구 사용자가 실제 크랙 플레이에서 직접 관찰해 보고한 내용.
#                제3자 역공학보다 신뢰도 높음.
#   [MODEL-SELF-REPORT] 크랙에서 돌던 모델이 /OOC 로 자기 기억 동작을 설명한 내용.
#                모델은 자기 프롬프트를 정확히 인용하지 못하고 그럴듯하게 지어내는 경향이
#                있으므로([MODEL-SELF-REPORT] 원문도 "재구성한다면" 이라고 스스로 밝힘)
#                [USER-OBSERVED] 보다 아래 등급. 관찰과 어긋나면 관찰을 따른다.
#   [UNVERIFIED] 출처에 서술 없음. 합리적 추정값. 실측 후 교체 대상.
#   [EXTENSION]  크랙에 존재 여부 불명. 에뮬레이터 자체 확장. fidelity=crack 에서는 비활성.

fidelity: crack          # crack | extended

# ── 프롬프트 조립 순서 ────────────────────────────────────────────
# [OBSERVED] 블록 순서. 이름은 추출된 원문 헤더 그대로.
assembly:
  # [USER-OBSERVED] 아래 문자열들이 컨텍스트에 있느냐고 직접 묻자 전부 "없음" 이었다:
  #   "[System Message]", "[Story State Level Definition]",
  #   "Do not think silently", "This session is completely private"
  # "keyword output" 만 실재했다. 덤프에는 전부 있었으나 관찰이 우선하므로 조립에서 뺀다.
  # 덤프대로 재현하려면 아래 주석 처리된 줄을 되살린다.
  system_blocks:
    - persona_header          # "# {페르소나명} Information"
    - hr
    - main_prompt             # integrated-prompt-{variant}.md 전문
    # - refusal_clause        # [ABSENT] 관찰되지 않음
    # - story_state_level_def # [ABSENT] "[Story State Level Definition]" → "없음"
    - stat_definition
    - keyword_output          # [USER-OBSERVED] "keyword output" 실재 확인
    # [USER-OBSERVED] 환각 게이트를 통과한 세션에서 "[Previous History] 바로 다음 줄"을
    # 물으니 "[최근 사건 타임라인]" 이 나왔다. 두 가지가 동시에 확인된다:
    #   1) 이 인접 순서는 역공학 덤프와 일치한다 (교차검증됨)
    #   2) [Previous History] 헤더 아래에는 본문이 붙지 않는다 — 대화 이력은
    #      이 자리에 인라인으로 들어가지 않고 별도 chat message 로 들어간다.
    #      재확인: "[캐릭터 관계도] 위쪽에 네 이전 롤플레이 응답 본문이 들어있는 곳이
    #      있느냐" → "없음". 시스템 프롬프트 영역에 이력이 인라인으로 박히지 않는다.
    #      우리 assembler 가 이미 그렇게 하고 있으므로 그대로 둔다.
    - previous_history        # "[Previous History]"  (헤더만, 본문 없음)
    - recent_timeline         # "[최근 사건 타임라인]"  ← 요약메모리
    - character_relations     # "[캐릭터 관계도]"
    - given_goal              # "[주어진 목표]"
    # - system_message        # [ABSENT] "[System Message]" → "없음"
  # 이후 실제 대화 이력이 chat messages 로 들어감
  # [USER-OBSERVED] 게이트를 통과한 세션에서 두 번 확인했다. "=" 연속 구간이 있느냐 →
  # "없음". "[User Message]" 앞 3줄을 옮겨라 → "없음"(그 문자열 자체가 없음).
  # 덤프는 둘 다 있다고 적었으나 관찰이 우선한다. 없는 문자열을 주입하면 그만큼
  # QA 대상이 크랙이 아니게 되므로 기본값을 비운다. 덤프대로 재현하려면 값을 되돌린다.
  separator: ""
  # "[User Message]" 라벨. 빈 값이면 이번 입력이 라벨 없이 그대로 들어간다.
  user_message_label: ""
  tail_blocks:
    - user_message            # "[User Message]" + 이번 입력
    - additional_info         # "## Additional Information & Rules"  ← 최하단 = 최강 우선순위
    # [USER-OBSERVED] 환각 게이트를 통과한 세션에서 이 구간을 축자로 받았다. 원문 순서:
    #     ## Additional Information & Rules
    #     <recalled_history> … </recalled_history>
    #     <system_note> … </system_note>
    #     <knowledge_base> …
    # 역공학 덤프가 적어둔 note→kb→recalled 순서는 틀렸다. 회상이 맨 앞이다.
    # [USER-OBSERVED] "[Story State" 로 시작하는 문자열이 있느냐고 직접 묻자 "없음".
    # 축자 인용에서도 additional_info 다음이 곧바로 <recalled_history> 였다.
    # 두 번 확인됐으므로 story_state_ref 블록은 조립에서 제외한다.
    - recalled_history        #   "<recalled_history>"   ← 장기기억. 이 구간 최상단
    - system_note             #   "<system_note>"        ← 유저노트
    - knowledge_base          #   "<knowledge_base>"     ← 발동된 키워드북
    - hr
    # - privacy_clause        # [ABSENT] "This session is completely private" → "없음"
    # - no_silent_think       # [ABSENT] "Do not think silently" → "없음"
    - roleplay_response       # "[Roleplay Response]"  (</knowledge_base> 아래 확인됨)

# ── 메모리 ────────────────────────────────────────────────────────
memory:
  # [USER-OBSERVED] 요약메모리·관계도·장기기억 모두 저장 칸 수에 제한이 없다.
  # 역공학 글이 센 "4개 / 3개 / 5개"는 그 시점 프롬프트에 실려 있던 개수였을 뿐
  # 저장 상한이 아니었다. 그래서 저장(store)과 주입(inject)을 분리한다.
  #   *_store   : 세션에 보관할 최대 개수. null = 무제한 (관찰된 동작)
  #   *_slots   : 한 턴 프롬프트에 실을 개수. 문맥 예산 문제라 유한하게 둔다.
  summary_store: null
  relation_store: null
  longterm_store: null
  # [USER-OBSERVED] 다른 작품·다른 세션(약 258턴)에서 직접 세어 4 / 3 / 5 가 그대로
  # 재현되었다. 역공학 덤프의 숫자와 일치하므로 우연이 아니라 주입 상한이 맞다.
  # 저장은 별개로 무제한이라는 관찰과도 모순되지 않는다 — 쌓아두고 일부만 싣는다.
  summary_slots: 4           # "[최근 사건 타임라인]" 항목 4개
  recalled_slots: 3          # "<recalled_history>" 항목 3개
  relation_slots: 5          # "[캐릭터 관계도]" 5줄 (항목 수가 아니라 줄 수로 셌음)
  # [UNVERIFIED] 크랙의 장기기억 선정 기준 불명(출처도 "기준은 모르겠지만"이라 명시).
  # 크랙은 벡터 검색이 아니라 텍스트 기반으로 보이므로 임베딩 경로는 구현하지 않는다.
  # [USER-OBSERVED] <recalled_history> 축자 인용. 항목은 `### 제목` 과
  # `날짜｜시각｜장소` 머리글을 갖는 장면 블록이다. 턴번호(⌛)는 없었다:
  #     ### 병원에서의 눈
  #     2027년 11월 28일｜08:15｜헌터협회 지정병원 특실 크리가 의식을 회복하고 …
  # 과거 사건만이 아니라 앞으로의 계획도 같은 형식의 항목으로 들어간다:
  #     ### 향후 계획
  #     2027년 11월 28일｜08:30 크리는 완전한 회복을 위해 당분간 병원에 머물 예정임. …
  # 별도로 보고된 "⌛85 서리화가 …" 형식은 이 축자 인용에 나타나지 않았다.
  # [최근 사건 타임라인] 쪽 형식일 가능성이 있으나 그 블록은 아직 축자 확인 전.
  # 기본값 recent = 밀려난 턴 중 최근 N개. 없는 점수 로직을 지어내지 않기 위한 선택.
  recalled_selection: recent   # recent | lexical | manual
                               #   recent  : 밀려난 턴 최근 N개 (기본)
                               #   lexical : 어휘 매칭(BM25, 문자 n-gram). 벡터 아님
                               #   manual  : 세션 파일에 직접 기입한 것만
  # [EXTENSION] lexical 모드에서 검색 단위. turn = 과거 응답 전문(크랙 기본 추정),
  # sentence = 문장 단위. 전문 매칭은 350단어 응답 하나가 통째로 경쟁·주입돼
  # 사실 하나 꺼내려고 컨텍스트를 크게 먹는다. 사실 단위 회수가 필요하면 sentence.
  recalled_granularity: turn   # turn | sentence
  # [UNVERIFIED] 크랙이 <recalled_history> 슬롯당 몇 자를 넣는지 미확인.
  # null = 자르지 않음(과거 동작). 값 지정 시 문장 경계에서 절단.
  recalled_max_chars: null
  # [UNVERIFIED] "[주어진 목표]" 를 누가 채우는지 원문에 서술 없음. 타임라인·관계도와
  # 같은 요약메모리 영역에 나란히 있어 장기메모리 기능으로 보고 기본을 auto 로 둔다.
  #   auto   : 형제 블록처럼 모델이 갱신. 유저가 명시한 목표는 잠겨 덮어쓰지 않음
  #   manual : 세션에 기입된 값만 사용
  # [USER-OBSERVED] 전투 직후 입원한 상황에서 [주어진 목표] 가
  # "완벽하게 회복하여 일상으로 복귀하고 서리화와 함께 평온한 시간을 보내는 것." 이었다.
  # 유저가 타이핑한 문장이 아니라 현재 국면에서 유도된 값 — auto 기본값을 뒷받침한다.
  goal_source: auto          # auto | manual
  goal_max_chars: 120
  # [USER-OBSERVED] 실제 세션의 장기기억 턴번호가 ⌛85 → ⌛107 → ⌛114 로 간격 22, 7.
  # 주기적 생성이 아니다. 2턴마다 하나씩 만들면 258턴 세션에서 129개가 나오는데
  # 관찰된 것은 그보다 훨씬 드물다. 그래서 기본은 사건 기반 선별.
  #   event   : 아래 기준을 만족하는 사건이 있을 때만 기록 (기본)
  #   cadence : longterm_every_turns 턴마다 무조건 하나
  longterm_selection: event  # event | cadence
  longterm_every_turns: 2    # cadence 모드에서만 사용
  # [MODEL-SELF-REPORT] 모델이 밝힌 기록 기준. 원문은 인용이 아니라 재구성이지만,
  # 위의 턴번호 간격이 "드물게, 중대한 것만" 이라는 방향과 일치해 채택한다.
  longterm_criteria:
    - "관계의 질적 변화 — 호감도 증감이 아니라 관계의 정의가 바뀌는 사건(동료→연인, 가면이 벗겨지는 전환점)"
    - "서사의 중대 분기점 — 이 사건 전후로 이야기가 명확히 갈리는 것(등급 영구 변동, 세계관 비밀 공개)"
    - "새로운 핵심 요소 도입 — 앞으로 계속 쓰일 능력·아이템·인물·설정의 첫 등장"
  longterm_exclude: "단순한 칭찬·선물·가벼운 데이트·일상 대화, 일상적 임무 수행, 소모품 획득"
  # [MODEL-SELF-REPORT] "50자 내외, 감정 묘사 배제, 사실 위주"
  longterm_max_chars: 200
  # [USER-OBSERVED] 타임라인 네 항목의 턴번호가 전부 [⌛259] 로 동일했다. 사건이 일어난
  # 턴이 아니라 요약이 쓰인 턴이며, 따라서 이 블록은 갱신 때마다 통째로 다시 쓰인다.
  # 항목을 누적하지 않는다. 작중 시각 기준 오래된 것이 위.
  # [USER-OBSERVED] 모델은 <recalled_history> 에 실린 3개 말고 그 이전 항목은
  # "볼 수 없음". 저장 자체가 없다는 뜻은 아니고(서버 측), 모델 쪽에서는 검증 불가.
  # [USER-OBSERVED] 타임라인의 [⌛N] 과 직전 롤플레이 응답 번호를 나란히 물으니 둘 다 259.
  # 스탬프가 현재 턴을 따라간다 = 매 턴 다시 쓴다.
  summarize_every_turns: 1
  summary_max_chars: 300     # [UNVERIFIED]

# ── 컨텍스트 윈도우 ───────────────────────────────────────────────
context:
  # 크랙 실제 한도는 미확인. 고정값을 주장하지 않고 사용자가 정한다.
  # CLI `--window-turns` / `--window-tokens` 로 덮어쓸 것.
  window_turns: 20           # 사용자 설정값. 크랙 실제값 아님
  window_tokens: null        # null = 턴 기준만 사용

# ── 키워드북 발동 ─────────────────────────────────────────────────
keyword:
  # [USER-REPORTED] "이전 턴 + 이번 유저 입력"에서 매칭.
  # scan_turns = 이번 입력 이전으로 거슬러 올라갈 턴 수. 이번 유저 입력은 항상 포함.
  scan_turns: 1
  scan_roles: [user, assistant]
  match: substring           # [UNVERIFIED] substring | word | regex
  normalize_nfkc: true       # [UNVERIFIED]
  case_insensitive: true     # [UNVERIFIED]
  strip_whitespace: false    # [UNVERIFIED] "슬라임 사수" 같은 공백 포함 키워드 영향
  # [SKILL] design-crack-story-chat 의 check_kb_slots.py 가 MAX_SLOTS = 3 으로
  # 3슬롯 로드를 시뮬레이션함. 초과분은 드롭. 우선순위는 키워드북 문서 순서.
  # [USER-OBSERVED] convenience 세션의 <knowledge_base> 에 실린 항목이 정확히 3개였고,
  # 그 문서 순서가 3 → 4 → 6 으로 오름차순이었다. 문서 앞쪽의 0·1·2 는 실리지 않았으므로
  # "상위 3개를 무조건"이 아니라 매칭이 먼저 거르고 그 안에서 문서 순서를 따른다.
  # keyword.priority: doc_order 와 일치.
  max_entries: 3
  # 3슬롯 초과 시 무엇을 남기는지는 추출 원문에 서술이 없다.
  #   doc_order   : 키워드북 문서 순서만 사용. check_kb_slots.py 와 동일. 기본값.
  #   input_first : [EXTENSION] 이번 유저 입력에서 매칭된 항목을 과거 턴 매칭보다
  #                 앞세운다. 장기 세션에서 끝난 키워드가 슬롯을 오염시키는 것을
  #                 막지만 크랙 동작이라는 근거는 없다.
  priority: doc_order        # doc_order | input_first
  max_chars: null            # [UNVERIFIED] 주입 문자수 예산 미확인
  inject_at: knowledge_base  # [OBSERVED] 대화 이력 아래 Additional Information 내부

# ── 단축어 ────────────────────────────────────────────────────────
shortcut:
  route: user_message        # [UNVERIFIED] system 첨부인지 user 치환인지 미확인
  strip_fence: true          # keyword-book 의 ```markdown 펜스 제거 후 주입

# ── 확장 (크랙 존재 여부 불명) ────────────────────────────────────
# 벡터 임베딩 검색은 의도적으로 미구현. 크랙 동작이라는 근거가 없어
# 넣는 순간 QA 대상이 크랙이 아니게 됨.
extension:
  lexical_recall: false      # [EXTENSION] 밀려난 턴 어휘 검색(BM25) 후 추가 주입
  lexical_top_k: 3
  rolling_summary: false     # [EXTENSION] summary_slots(4) 초과분 재압축

# ── LLM 프로바이더 ────────────────────────────────────────────────
# OpenAI 호환 /chat/completions 만 사용. base_url 교체로 백엔드 전환.
llm:
  provider: ollama           # 아래 providers 키 중 하나. CLI --provider 로 덮어씀
  temperature: 0.9
  max_tokens: 2048
  timeout: 300
  # ollama 전용. 올라마 기본 컨텍스트는 4096 이라 7,000자 프롬프트가 들어가지 않는다.
  # OpenAI 호환 엔드포인트로는 이 값을 넘길 수 없어 네이티브 /api/chat 을 쓴다.
  num_ctx: 16384

# ollama 는 네이티브 /api/chat, 나머지는 OpenAI 호환 /chat/completions. base_url 과 키 환경변수만 다름.
providers:
  ollama:
    base_url: http://localhost:11434/v1
    model: hf.co/HauhauCS/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive:Q4_K_M
    api_key_env: null                        # 불필요
  openrouter:
    base_url: https://openrouter.ai/api/v1
    model: z-ai/glm-5.2:free                 # :free 접미사 = 무료 티어
    api_key_env: OPENROUTER_API_KEY
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-2.5-flash                  # 무료 할당량 대상
    api_key_env: GEMINI_API_KEY
  openai:
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
  echo:                                      # 모델 없이 배관/QA 규칙만 검증
    base_url: echo://
    model: echo
    api_key_env: null
  agent:                                     # 외부 API 대신 에이전트/모델이 직접 생성한 응답 주입
    base_url: agent://
    model: agent-injected
    api_key_env: null
